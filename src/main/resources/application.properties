# =====================================================================
# Datasource - PostgreSQL 16
# Credentials come from the environment, never from source control.
# =====================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:email_user}
quarkus.datasource.password=${DB_PASSWORD:email_password}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/email_app}

quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.acquisition-timeout=10S

# =====================================================================
# Schema ownership
# Flyway owns the schema. Hibernate only validates it at startup.
# =====================================================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.locations=db/migration

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.timezone=UTC

# =====================================================================
# Qute - server side UI
# =====================================================================
quarkus.qute.strict-rendering=true
# Never resolve a missing key at runtime: templates must be complete.
quarkus.qute.remove-standalone-lines=true

# =====================================================================
# REST / OpenAPI
# =====================================================================
quarkus.smallrye-openapi.info-title=Email Campaign API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.path=/openapi

# =====================================================================
# Application configuration (SmallRye Config)
# =====================================================================

# --- Email sending / rate limiting -----------------------------------
# How many recipients are sent per batch before the worker pauses.
app.email.batch-size=10
# How long the worker sleeps between two batches (milliseconds).
app.email.delay-ms=1000
# How many times a single recipient may be attempted before it is
# permanently failed and excluded from further "Retry Failed" runs.
app.email.max-retries=3
# SMTP connect/read/write timeout used by the provider.
app.email.connection-timeout-ms=10000
# Fallback sender, used only when no email configuration has been saved.
# The SMTP_FROM_* environment variables are read separately and win when set;
# they are deliberately not inlined here, because an empty environment
# variable would fail the configuration mapping at startup.
app.email.from-email=no-reply@localhost
app.email.from-name=Email Campaign Manager

# --- Background job engine -------------------------------------------
# Interval at which the scheduler looks for queued jobs.
app.job.poll-interval-ms=1000
# Cooperative cancellation check interval while a job is running.
app.job.control-check-interval-ms=250
# Kill switch for the background worker (useful for tests and demos).
app.job.worker-enabled=true
# Maximum number of jobs processed concurrently by this instance.
app.job.max-concurrent-jobs=2

# --- Database diagnostics --------------------------------------------
app.database.log-sql=false
app.database.show-sql=false

# =====================================================================
# Dev / test helpers
# =====================================================================
%test.quarkus.flyway.migrate-at-start=false
%dev.quarkus.hibernate-orm.log.sql=true

# SmallRye Health is served under /q/health by default.

quarkus.log.category."com.example.emailapp".level=INFO
