services:

  postgres:
    image: postgres:16
    container_name: email-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-email_app}
      POSTGRES_USER: ${POSTGRES_USER:-email_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-email_user} -d ${POSTGRES_DB:-email_app}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: email-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/email_app}
      DB_USERNAME: ${POSTGRES_USER:-email_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-email_password}
      SMTP_HOST: ${SMTP_HOST:-smtp.sendgrid.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-apikey}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@localhost}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Email Campaign Manager}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
